<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Viwer — Markdown Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<link id="hljs-theme" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" />
<style>
:root{
  --bg:#ffffff; --panel:#f7f8fa; --border:#e4e7eb; --text:#1b1f24;
  --muted:#6b7280; --accent:#3b5bdb; --code-bg:#f4f5f7; --shadow:rgba(0,0,0,.06);
}
[data-theme="dark"]{
  --bg:#0f1115; --panel:#151a22; --border:#262d39; --text:#e6e9ef;
  --muted:#8b95a5; --accent:#7c9bff; --code-bg:#191f29; --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:12px; padding:10px 18px;
  border-bottom:1px solid var(--border); background:var(--panel);
  position:sticky; top:0; z-index:20;
}
.brand{font-weight:700; letter-spacing:-.02em; font-size:17px}
.brand span{color:var(--accent)}
.file-name{color:var(--muted); font-size:13px;
  max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.spacer{flex:1}
button{
  font:inherit; font-size:13px; padding:6px 12px; border-radius:7px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  cursor:pointer; transition:.15s;
}
button:hover{border-color:var(--accent); color:var(--accent)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{opacity:.9; color:#fff}
main{flex:1; display:flex; min-height:0}
aside{
  width:250px; flex-shrink:0; border-right:1px solid var(--border);
  background:var(--panel); overflow-y:auto; padding:18px 14px;
}
aside.hidden{display:none}
aside h4{margin:0 0 10px; font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
aside a{
  display:block; padding:4px 8px; border-radius:5px; font-size:13px;
  color:var(--muted); text-decoration:none; line-height:1.35;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
aside a:hover{background:var(--bg); color:var(--accent)}
aside a.lvl3{padding-left:20px; font-size:12.5px}
aside a.lvl4{padding-left:32px; font-size:12px}
.scroll{flex:1; overflow-y:auto}
article{max-width:820px; margin:0 auto; padding:44px 40px 120px; line-height:1.7}
.empty{
  height:100%; display:flex; flex-direction:column; gap:10px;
  align-items:center; justify-content:center; color:var(--muted); text-align:center;
}
.empty .big{font-size:40px}
.empty h2{margin:0; color:var(--text); font-size:20px}
.empty p{margin:0; font-size:14px}
article h1,article h2,article h3,article h4{
  line-height:1.3; margin:1.8em 0 .6em; letter-spacing:-.015em; scroll-margin-top:70px;
}
article h1{font-size:2em; margin-top:0}
article h2{font-size:1.5em; border-bottom:1px solid var(--border); padding-bottom:.3em}
article h3{font-size:1.2em}
article p,article ul,article ol,article blockquote{margin:0 0 1em}
article a{color:var(--accent)}
article img{max-width:100%; border-radius:8px}
article blockquote{
  border-left:3px solid var(--accent); padding:2px 0 2px 16px;
  color:var(--muted); margin-left:0;
}
article code{
  background:var(--code-bg); padding:.15em .4em; border-radius:5px;
  font-size:.88em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
article pre{
  background:var(--code-bg); border:1px solid var(--border); border-radius:10px;
  padding:16px; overflow-x:auto; position:relative;
}
article pre code{background:none; padding:0; font-size:13px; line-height:1.55}
article table{border-collapse:collapse; width:100%; margin:0 0 1em; font-size:14px}
article th,article td{border:1px solid var(--border); padding:8px 12px; text-align:left}
article th{background:var(--panel)}
article hr{border:none; border-top:1px solid var(--border); margin:2em 0}
article input[type=checkbox]{margin-right:6px}
.copy-btn{
  position:absolute; top:8px; right:8px; font-size:11px; padding:3px 8px;
  opacity:0; transition:.15s;
}
pre:hover .copy-btn{opacity:1}
#drop{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center;
  background:rgba(59,91,219,.10); backdrop-filter:blur(3px);
}
#drop.on{display:flex}
#drop div{
  border:2px dashed var(--accent); color:var(--accent); background:var(--bg);
  padding:28px 44px; border-radius:14px; font-size:17px; font-weight:600;
  box-shadow:0 10px 40px var(--shadow);
}
@media print{
  header,aside,.copy-btn{display:none!important}
  .scroll{overflow:visible}
  article{padding:0; max-width:100%}
}
@media (max-width:760px){
  aside{display:none}
  article{padding:28px 20px 80px}
  .file-name{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">vi<span>wer</span></div>
  <div class="file-name" id="fname"></div>
  <div class="spacer"></div>
  <button id="tocBtn" title="Toggle outline">☰ Outline</button>
  <button id="themeBtn" title="Toggle theme">◐ Theme</button>
  <button id="printBtn" title="Print / Save as PDF">⎙ Print</button>
  <button class="primary" id="openBtn">Open .md</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.txt" hidden />
</header>

<main>
  <aside id="toc" class="hidden"><h4>Outline</h4><nav id="tocList"></nav></aside>
  <div class="scroll" id="scroll">
    <div class="empty" id="empty">
      <div class="big">📄</div>
      <h2>Koi markdown file drop karo</h2>
      <p>Ya "Open .md" dabao. Sab kuch locally render hota hai — kuch upload nahi hota.</p>
    </div>
    <article id="content" hidden></article>
  </div>
</main>

<div id="drop"><div>Drop the .md file</div></div>

<script>
const $ = (id) => document.getElementById(id);
const content = $("content"), empty = $("empty"), toc = $("toc"), tocList = $("tocList");

// marked v12 ne highlight option hata diya hai — highlighting render ke baad hoti hai
marked.setOptions({ gfm: true, breaks: false });

function slug(s, used) {
  let base = s.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-") || "section";
  let id = base, i = 2;
  while (used.has(id)) id = base + "-" + i++;
  used.add(id);
  return id;
}

function buildToc() {
  const used = new Set();
  const heads = content.querySelectorAll("h1,h2,h3,h4");
  tocList.innerHTML = "";
  if (!heads.length) { toc.classList.add("hidden"); return; }
  heads.forEach((h) => {
    if (!h.id) h.id = slug(h.textContent, used);
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    a.className = "lvl" + h.tagName[1];
    a.onclick = (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    tocList.appendChild(a);
  });
  toc.classList.remove("hidden");
}

function addCopyButtons() {
  content.querySelectorAll("pre").forEach((pre) => {
    const b = document.createElement("button");
    b.className = "copy-btn";
    b.textContent = "Copy";
    b.onclick = () => {
      navigator.clipboard.writeText(pre.innerText.replace(/Copy$/, "").trim());
      b.textContent = "Copied!";
      setTimeout(() => (b.textContent = "Copy"), 1200);
    };
    pre.appendChild(b);
  });
}

function render(md, name) {
  const html = DOMPurify.sanitize(marked.parse(md));
  content.innerHTML = html;
  content.querySelectorAll("pre code").forEach((el) => {
    try { hljs.highlightElement(el); } catch {}
  });
  buildToc();
  addCopyButtons();
  content.hidden = false;
  empty.style.display = "none";
  $("fname").textContent = name || "";
  document.title = (name ? name + " — " : "") + "Viwer";
  $("scroll").scrollTop = 0;
}

function loadFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => render(r.result, file.name);
  r.readAsText(file);
}

$("openBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => loadFile(e.target.files[0]);
$("tocBtn").onclick = () => toc.classList.toggle("hidden");
$("printBtn").onclick = () => window.print();

$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  setTheme(cur === "dark" ? "light" : "dark");
};

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("hljs-theme").href =
    "https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github" +
    (t === "dark" ? "-dark" : "") + ".min.css";
  try { localStorage.setItem("viwer-theme", t); } catch {}
}
setTheme(
  (() => { try { return localStorage.getItem("viwer-theme"); } catch { return null; } })() ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
);

let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("drop").classList.add("on"); });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("dragleave", () => { if (--dragDepth <= 0) $("drop").classList.remove("on"); });
addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  $("drop").classList.remove("on");
  loadFile(e.dataTransfer.files[0]);
});

addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "o") { e.preventDefault(); $("fileInput").click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "p") { e.preventDefault(); window.print(); }
});
</script>
</body>
</html>
