<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Viwer — read Markdown files in your browser</title>
<meta name="description" content="A single-file Markdown viewer. Open a .md file and read it. Nothing is uploaded." />
<meta name="theme-color" content="#0f1216" />
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<link id="hljs-theme" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
<style>
:root{
  --paper:#ffffff; --sheet:#f5f6f5; --ink:#15181c; --quiet:#6d737b;
  --rule:#e3e6e4; --accent:#1b6e52; --mark:#eaf3ee; --code:#f3f5f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --paper:#0f1216; --sheet:#171b20; --ink:#e4e8e6; --quiet:#8b939a;
  --rule:#252b31; --accent:#5fd3a8; --mark:#16271f; --code:#171c21;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; display:flex; flex-direction:column;
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}

/* header */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  height:52px; padding:0 14px; background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.mark{font-family:var(--mono); font-size:15px; font-weight:600; letter-spacing:-.04em}
.mark b{color:var(--accent); font-weight:600}
.name{
  font-size:13px; color:var(--quiet); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
button{
  font:inherit; font-size:13px; line-height:1; padding:8px 11px; border-radius:7px;
  border:1px solid transparent; background:none; color:var(--quiet); cursor:pointer;
}
button:hover{background:var(--sheet); color:var(--ink)}
.solid{border-color:var(--rule); color:var(--ink); font-weight:500; padding:8px 14px}
.solid:hover{border-color:var(--accent); color:var(--accent); background:none}

/* reader */
main{flex:1; display:flex; min-height:0}
.rail{
  width:230px; flex:none; overflow-y:auto; padding:22px 10px 60px 18px;
  border-right:1px solid var(--rule); background:var(--paper);
}
.rail[hidden]{display:none}
.rail h2{margin:0 0 10px 8px; font-size:12px; font-weight:600; color:var(--quiet)}
.rail a{
  display:block; padding:6px 8px; border-radius:6px; text-decoration:none;
  font-size:13px; line-height:1.4; color:var(--quiet);
  border-left:2px solid transparent;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.rail a:hover{color:var(--ink); background:var(--sheet)}
.rail a.on{color:var(--accent); border-left-color:var(--accent); background:var(--mark)}
.rail a.h3{padding-left:20px}
.rail a.h4{padding-left:30px; font-size:12.5px}
.stage{flex:1; overflow-y:auto; scroll-behavior:smooth}
.scrim{display:none}

/* document */
.doc{
  max-width:44rem; margin:0 auto; padding:40px 26px 120px;
  font-size:16.5px; line-height:1.7; overflow-wrap:break-word;
}
.doc > :first-child{margin-top:0}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{
  line-height:1.3; letter-spacing:-.02em; margin:1.9em 0 .55em;
  scroll-margin-top:70px; font-weight:650;
}
.doc h1{font-size:1.85em}
.doc h2{font-size:1.42em; padding-bottom:.25em; border-bottom:1px solid var(--rule)}
.doc h3{font-size:1.18em}
.doc p,.doc ul,.doc ol,.doc blockquote{margin:0 0 1.1em}
.doc li{margin:.28em 0}
.doc a{color:var(--accent); text-underline-offset:3px}
.doc img{max-width:100%; height:auto; border-radius:6px}
.doc blockquote{
  margin-left:0; padding-left:16px; border-left:2px solid var(--accent); color:var(--quiet);
}
.doc hr{border:0; border-top:1px solid var(--rule); margin:2.2em 0}
.doc code{
  font-family:var(--mono); font-size:.86em; background:var(--code);
  padding:.15em .38em; border-radius:4px;
}
.doc pre{
  position:relative; background:var(--code); border:1px solid var(--rule);
  border-radius:9px; padding:15px 16px; overflow-x:auto; margin:0 0 1.2em;
  -webkit-overflow-scrolling:touch;
}
.doc pre code{background:none; padding:0; font-size:13px; line-height:1.6}
.table-wrap{overflow-x:auto; margin:0 0 1.2em}
.doc table{border-collapse:collapse; width:100%; font-size:14.5px}
.doc th,.doc td{border-bottom:1px solid var(--rule); padding:9px 12px; text-align:left}
.doc thead th{border-bottom-width:2px; font-weight:600; white-space:nowrap}
.doc input[type=checkbox]{margin-right:8px; accent-color:var(--accent)}
.copy{
  position:absolute; top:8px; right:8px; font-size:11.5px; padding:4px 9px;
  border:1px solid var(--rule); border-radius:5px; background:var(--paper);
  color:var(--quiet); opacity:0;
}
pre:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{color:var(--accent); border-color:var(--accent); background:var(--paper)}

/* drop overlay */
.drop{
  position:fixed; inset:0; z-index:60; display:none; place-items:center;
  background:var(--paper);
}
.drop.on{display:grid}
.drop span{
  border:2px dashed var(--accent); color:var(--accent);
  padding:26px 38px; border-radius:12px; font-size:16px; font-weight:500;
}

@media (prefers-reduced-motion:reduce){*{transition:none!important; scroll-behavior:auto!important}}
@media print{
  .bar,.rail,.copy,.drop,.scrim{display:none!important}
  .stage{overflow:visible}
  .doc{max-width:100%; padding:0; font-size:11.5pt}
  .doc pre{white-space:pre-wrap; word-break:break-word}
}

/* mobile: outline becomes a slide-over */
@media (max-width:760px){
  .bar{height:50px; padding:0 10px; gap:8px}
  .doc{padding:28px 18px 96px; font-size:16px}
  .doc h1{font-size:1.6em}
  .doc h2{font-size:1.3em}
  .rail{
    position:fixed; top:50px; bottom:0; left:0; width:min(78vw,290px); z-index:40;
    border-right:1px solid var(--rule); box-shadow:0 0 40px rgba(0,0,0,.28);
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
  }
  .rail a{padding:9px 8px; font-size:14px}
  .scrim{
    display:block; position:fixed; inset:50px 0 0; z-index:35;
    background:rgba(0,0,0,.4);
  }
  .scrim[hidden]{display:none}
  .copy{opacity:1}
}
</style>
</head>
<body>
<header class="bar">
  <span class="mark">vi<b>wer</b></span>
  <span class="name" id="name"></span>
  <button id="railBtn" hidden aria-expanded="false">Outline</button>
  <button id="themeBtn" title="Switch theme">Light</button>
  <button id="openBtn" class="solid">Open file</button>
</header>
<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mdx,.txt" hidden />

<main id="reader">
  <div class="scrim" id="scrim" hidden></div>
  <nav class="rail" id="rail" hidden aria-label="Outline">
    <h2>Outline</h2>
    <div id="railList"></div>
  </nav>
  <div class="stage" id="stage">
    <article class="doc" id="doc"></article>
  </div>
</main>

<div class="drop" id="drop"><span>Release to open</span></div>

<script type="text/markdown" id="sampleDoc">
# Markdown, briefly

This page is a Markdown reader. Press **Open file** in the corner — or drop a
`.md` file anywhere on this page — and your document replaces this one. The file
never leaves your machine; nothing is uploaded.

Until then, here is something to read. Markdown is plain text that stays
readable before anything renders it.

## Text

You get *italic*, **bold**, `inline code`, ~~strikethrough~~ and
[links](https://daringfireball.net/projects/markdown/).

> A blockquote holds someone else's words.

## Lists

- Unordered items
  - nested freely
1. Ordered when order matters
2. Numbers are renumbered for you

- [x] Task lists render as checkboxes
- [ ] Unchecked items stay unchecked

## Code

```python
def read(path: str) -> str:
    with open(path, encoding="utf-8") as f:
        return f.read()
```

## Tables

| Syntax | Renders as |
|---|---|
| `# Title` | Heading, and an outline entry |
| `> quote` | Blockquote |
| `---` | Horizontal rule |

## Getting around

Headings become the outline on the left, and the entry you are reading stays
marked as you scroll. Code blocks carry a copy button. The theme switch sits
next to **Open file**, and `Cmd`/`Ctrl` + `O` opens a file from anywhere.

That is most of the language. Open one of your own files to see it work.
</script>

<script>
const $ = (id) => document.getElementById(id);
const doc = $("doc"), rail = $("rail"), railList = $("railList"), stage = $("stage");
const mobile = () => matchMedia("(max-width:760px)").matches;
let links = [], heads = [];

marked.setOptions({ gfm: true, breaks: false });

function slugify(text, taken) {
  const base = text.toLowerCase().trim()
    .replace(/[^\w\s-]/g, "").replace(/\s+/g, "-") || "section";
  let id = base, n = 2;
  while (taken.has(id)) id = `${base}-${n++}`;
  taken.add(id);
  return id;
}

function closeRail() {
  rail.hidden = true;
  $("scrim").hidden = true;
  $("railBtn").setAttribute("aria-expanded", "false");
}

function buildOutline() {
  const taken = new Set();
  heads = [...doc.querySelectorAll("h1,h2,h3,h4")];
  railList.innerHTML = "";
  links = heads.map((h) => {
    if (!h.id) h.id = slugify(h.textContent, taken);
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    a.className = "h" + h.tagName[1];
    a.addEventListener("click", (e) => {
      e.preventDefault();
      h.scrollIntoView({ block: "start" });
      if (mobile()) closeRail();
    });
    railList.appendChild(a);
    return a;
  });
  const has = heads.length > 1;
  $("railBtn").hidden = !has;
  rail.hidden = !has || mobile();
  $("scrim").hidden = true;
}

function decorate() {
  doc.querySelectorAll("pre code").forEach((el) => {
    try { hljs.highlightElement(el); } catch {}
  });
  doc.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });
  doc.querySelectorAll("pre").forEach((pre) => {
    const code = pre.querySelector("code");
    if (!code) return;
    const b = document.createElement("button");
    b.className = "copy";
    b.type = "button";
    b.textContent = "Copy";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code.innerText); } catch { return; }
      b.textContent = "Copied";
      setTimeout(() => (b.textContent = "Copy"), 1400);
    });
    pre.appendChild(b);
  });
  doc.querySelectorAll("a[href^='http']").forEach((a) => {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  });
}

const siteTitle = document.title;

function render(md, name, sample = false) {
  doc.innerHTML = DOMPurify.sanitize(marked.parse(md));
  decorate();
  buildOutline();
  $("name").textContent = name;
  document.title = sample ? siteTitle : `${name} — Viwer`;
  stage.scrollTop = 0;
  highlightActive();
}

render($("sampleDoc").textContent.trim(), "Markdown, briefly", true);

function openFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => render(String(reader.result), file.name);
  reader.onerror = () => alert("That file could not be read. Try another one.");
  reader.readAsText(file);
}

function highlightActive() {
  if (!links.length) return;
  let active = 0;
  heads.forEach((h, i) => { if (h.getBoundingClientRect().top <= 120) active = i; });
  links.forEach((a, i) => a.classList.toggle("on", i === active));
}
stage.addEventListener("scroll", highlightActive, { passive: true });

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  $("hljs-theme").href =
    "https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github" +
    (mode === "dark" ? "-dark" : "") + ".min.css";
  $("themeBtn").textContent = mode === "dark" ? "Light" : "Dark";
  try { localStorage.setItem("viwer.theme", mode); } catch {}
}
let saved = null;
try { saved = localStorage.getItem("viwer.theme"); } catch {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

const pick = () => $("fileInput").click();
$("openBtn").addEventListener("click", pick);
$("fileInput").addEventListener("change", (e) => openFile(e.target.files[0]));
$("themeBtn").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

$("railBtn").addEventListener("click", () => {
  const show = rail.hidden;
  rail.hidden = !show;
  $("scrim").hidden = !show || !mobile();
  $("railBtn").setAttribute("aria-expanded", String(show));
});
$("scrim").addEventListener("click", closeRail);

let depth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("drop").classList.add("on"); });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("dragleave", () => { if (--depth <= 0) $("drop").classList.remove("on"); });
addEventListener("drop", (e) => {
  e.preventDefault(); depth = 0; $("drop").classList.remove("on");
  openFile(e.dataTransfer.files[0]);
});

addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") { e.preventDefault(); pick(); }
  if (e.key === "Escape" && mobile()) closeRail();
});
</script>
</body>
</html>
