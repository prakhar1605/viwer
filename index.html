<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Viwer — read Markdown files in your browser</title>
<meta name="description" content="A single-file Markdown viewer. Open a .md file and read it. Nothing is uploaded." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)" />
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<link rel="stylesheet" media="(prefers-color-scheme: light)"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" />
<link rel="stylesheet" media="(prefers-color-scheme: dark)"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
<style>
:root{
  --paper:#ffffff; --ink:#15181c; --quiet:#6d737b;
  --rule:#e3e6e4; --accent:#1b6e52; --code:#f3f5f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0f1216; --ink:#e4e8e6; --quiet:#8b939a;
    --rule:#252b31; --accent:#5fd3a8; --code:#171c21;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

/* the only control */
.open{
  position:fixed; z-index:50;
  top:calc(12px + env(safe-area-inset-top));
  right:calc(14px + env(safe-area-inset-right));
  font:inherit; font-size:13px; line-height:1; font-weight:500; cursor:pointer;
  padding:9px 14px; border:1px solid var(--rule); border-radius:8px;
  background:var(--paper); color:var(--ink);
}
.open:hover{border-color:var(--accent); color:var(--accent)}

/* document */
.doc{
  max-width:44rem; margin:0 auto; padding:72px 26px 120px;
  font-size:16.5px; line-height:1.7; overflow-wrap:break-word;
}
.doc:empty{padding:0}
.doc > :first-child{margin-top:0}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{
  line-height:1.3; letter-spacing:-.02em; margin:1.9em 0 .55em; font-weight:650;
}
.doc h1{font-size:1.85em}
.doc h2{font-size:1.42em; padding-bottom:.25em; border-bottom:1px solid var(--rule)}
.doc h3{font-size:1.18em}
.doc p,.doc ul,.doc ol,.doc blockquote{margin:0 0 1.1em}
.doc li{margin:.28em 0}
.doc a{color:var(--accent); text-underline-offset:3px}
.doc img{max-width:100%; height:auto; border-radius:6px}
.doc blockquote{
  margin-left:0; padding-left:16px; border-left:2px solid var(--accent); color:var(--quiet);
}
.doc hr{border:0; border-top:1px solid var(--rule); margin:2.2em 0}
.doc code{
  font-family:var(--mono); font-size:.86em; background:var(--code);
  padding:.15em .38em; border-radius:4px;
}
.doc pre{
  position:relative; background:var(--code); border:1px solid var(--rule);
  border-radius:9px; padding:15px 16px; overflow-x:auto; margin:0 0 1.2em;
  -webkit-overflow-scrolling:touch;
}
.doc pre code{background:none; padding:0; font-size:13px; line-height:1.6}
.table-wrap{overflow-x:auto; margin:0 0 1.2em}
.doc table{border-collapse:collapse; width:100%; font-size:14.5px}
.doc th,.doc td{border-bottom:1px solid var(--rule); padding:9px 12px; text-align:left}
.doc thead th{border-bottom-width:2px; font-weight:600; white-space:nowrap}
.doc input[type=checkbox]{margin-right:8px; accent-color:var(--accent)}
.copy{
  position:absolute; top:8px; right:8px; font:inherit; font-size:11.5px; cursor:pointer;
  padding:4px 9px; border:1px solid var(--rule); border-radius:5px;
  background:var(--paper); color:var(--quiet); opacity:0;
}
pre:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{color:var(--accent); border-color:var(--accent)}

/* drop overlay */
.drop{
  position:fixed; inset:0; z-index:60; display:none; place-items:center;
  background:var(--paper);
}
.drop.on{display:grid}
.drop span{
  border:2px dashed var(--accent); color:var(--accent);
  padding:26px 38px; border-radius:12px; font-size:16px; font-weight:500;
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .open,.copy,.drop{display:none!important}
  .doc{max-width:100%; padding:0; font-size:11.5pt}
  .doc pre{white-space:pre-wrap; word-break:break-word}
}
@media (max-width:760px){
  .doc{padding:64px 18px 96px; font-size:16px}
  .doc h1{font-size:1.6em}
  .doc h2{font-size:1.3em}
  .copy{opacity:1}
}
</style>
</head>
<body>
<button class="open" id="openBtn">Open file</button>
<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mdx,.txt" hidden />

<article class="doc" id="doc"></article>

<div class="drop" id="drop"><span>Release to open</span></div>

<script>
const $ = (id) => document.getElementById(id);
const doc = $("doc");

marked.setOptions({ gfm: true, breaks: false });

function decorate() {
  doc.querySelectorAll("pre code").forEach((el) => {
    try { hljs.highlightElement(el); } catch {}
  });
  doc.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });
  doc.querySelectorAll("pre").forEach((pre) => {
    const code = pre.querySelector("code");
    if (!code) return;
    const b = document.createElement("button");
    b.className = "copy";
    b.type = "button";
    b.textContent = "Copy";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code.innerText); } catch { return; }
      b.textContent = "Copied";
      setTimeout(() => (b.textContent = "Copy"), 1400);
    });
    pre.appendChild(b);
  });
  doc.querySelectorAll("a[href^='http']").forEach((a) => {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  });
}

function openFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    doc.innerHTML = DOMPurify.sanitize(marked.parse(String(reader.result)));
    decorate();
    document.title = `${file.name} — Viwer`;
    scrollTo(0, 0);
  };
  reader.onerror = () => alert("That file could not be read. Try another one.");
  reader.readAsText(file);
}

const pick = () => $("fileInput").click();
$("openBtn").addEventListener("click", pick);
$("fileInput").addEventListener("change", (e) => openFile(e.target.files[0]));

let depth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("drop").classList.add("on"); });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("dragleave", () => { if (--depth <= 0) $("drop").classList.remove("on"); });
addEventListener("drop", (e) => {
  e.preventDefault(); depth = 0; $("drop").classList.remove("on");
  openFile(e.dataTransfer.files[0]);
});

addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") { e.preventDefault(); pick(); }
});
</script>
</body>
</html>
